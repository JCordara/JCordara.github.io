<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>turf war</title>
    <script type="module" crossorigin src="/assets/turfware-hdGzHv70.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="/assets/turfware-DobLf1XE.css">
  </head>
  <body>
    <div class="columns">
      <div class="column"></div>
      <div class="game">
        <p id="speed-label">Speed</p>
        <input type="range" min="1" max="20" value="1" id="speed-slider">
        <p id="speed-counter">1</p>
        <div>
          <canvas id="canvas" width="70vw" height="70vw" max-width="50vh" max-height="50vh"></canvas>
        </div>
        <div id="settings-container">
          <div class="spacer"></div>
          <button id="play-button">PLAY</button>
          <div id="size-setting-container">
            <input type="number" min="2" max="500" value="100" id="cell-count">
            <button id="size-set-button">Set</button>
          </div>
        </div>
      </div>
      <div class="column" id="scores">
      </div>
    </div>
    <div id="code-container">
      <div id="code-areas">
      </div>
      <div id="add-remove">
        <button id="add-player">+</button>
        <button id="remove-player">-</button>
      </div>
    </div>
    <a href="reference/index.html" target="_blank" rel="noopener noreferrer" id="help">Instruction set</a>
  </body>
</html>
